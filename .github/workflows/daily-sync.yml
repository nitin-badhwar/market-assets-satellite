name: Daily AMFI NAV Sync

on:
  schedule:
    - cron: '0 16 * * 1-5'  # 9:30 PM IST (Mon-Fri)
  workflow_dispatch:        # Manual trigger button

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Run AMFI Sync Script
        run: python sync_amfi.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated AMFI NAV update [skip ci]" && git push origin main)
