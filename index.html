<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Portfolio Satellite | Market Showcase</title>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #151922;
      --border: #262c38;
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #2f81f7;
      --profit: #3fb950;
      --loss: #f85149;
      --font-mono: ui-monospace, SFMono-Regular, "Roboto Mono", Menlo, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      line-height: 1.4;
    }
    .container { max-width: 1300px; margin: 0 auto; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 20px;
    }
    .brand-title { font-size: 20px; font-weight: 700; }
    .hero {
      background: #161c26; border: 1px solid var(--border); border-radius: 12px;
      padding: 20px; margin-bottom: 20px;
    }
    .hero-val { font-size: 30px; font-weight: 800; font-family: var(--font-mono); margin: 6px 0; }
    .badge { padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; background: rgba(137, 87, 229, 0.2); color: #bc8cff; }
    .table-container { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 13px; }
    th { color: var(--text-muted); font-size: 11px; text-transform: uppercase; }
    td.num, th.num { text-align: right; font-family: var(--font-mono); }
    button {
      background: var(--card-bg); color: var(--text); border: 1px solid var(--border);
      padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <div class="brand-title">Portfolio Satellite (Automated)</div>
      <div style="font-size: 12px; color: var(--text-muted);">Synced daily via GitHub Actions Backend</div>
    </div>
    <div style="display: flex; gap: 8px;">
      <button onclick="loadPortfolioData()">🔄 Reload Data</button>
      <button class="primary" onclick="exportForMasterVault()">Export for Master Vault</button>
    </div>
  </header>

  <div class="hero">
    <div style="font-size: 11px; text-transform: uppercase; color: var(--text-muted);">Current Market Valuation</div>
    <div class="hero-val" id="totalCurrentVal">₹0.00</div>
    <div style="font-size: 13px; font-family: var(--font-mono);" id="totalPL">Invested: ₹0.00</div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Scheme / Security</th>
          <th>Plan Type</th>
          <th>Units</th>
          <th class="num">Avg Buy NAV</th>
          <th class="num">Closing NAV</th>
          <th class="num">Invested Cost</th>
          <th class="num">Current Value</th>
          <th class="num">Unrealized P&L</th>
        </tr>
      </thead>
      <tbody id="holdingsBody">
        <tr><td colspan="8" style="text-align: center; color: var(--text-muted); padding: 24px;">Loading holdings...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  let portfolio = [];

  function formatINR(v) {
    return '₹' + Number(v || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  async function loadPortfolioData() {
    try {
      // Direct local fetch with cache-busting timestamp
      const res = await fetch('portfolio.json?t=' + Date.now());
      portfolio = await res.json();
      render();
    } catch (e) {
      document.getElementById('holdingsBody').innerHTML = `<tr><td colspan="8" style="text-align:center; color:var(--loss); padding:24px;">Failed to load portfolio.json. Ensure file exists in repo.</td></tr>`;
    }
  }

  function render() {
    let totVal = 0, totCost = 0;
    const tbody = document.getElementById('holdingsBody');

    tbody.innerHTML = portfolio.map(item => {
      const u = Number(item.units || 0);
      const bNav = Number(item.buyNav || 0);
      const cNav = Number(item.currentNav || bNav);
      const cost = Number(item.investedCost || (u * bNav));
      const val = Number(item.valuation || (u * cNav));
      const pl = val - cost;
      const pct = cost > 0 ? (pl / cost) * 100 : 0;
      const plColor = pl >= 0 ? 'var(--profit)' : 'var(--loss)';
      const sign = pl >= 0 ? '+' : '';

      totVal += val;
      totCost += cost;

      return `
        <tr>
          <td>
            <strong>${item.name}</strong><br>
            <span style="font-size:11px; color:var(--text-muted); font-family:var(--font-mono);">ISIN: ${item.isin || '—'}</span>
          </td>
          <td><span class="badge">${item.planType || 'Direct'}</span></td>
          <td class="num">${u.toLocaleString('en-IN', { minimumFractionDigits: 3 })}</td>
          <td class="num">${formatINR(bNav)}</td>
          <td class="num" style="color:var(--accent); font-weight:700;">${formatINR(cNav)}</td>
          <td class="num">${formatINR(cost)}</td>
          <td class="num" style="font-weight:700;">${formatINR(val)}</td>
          <td class="num" style="color:${plColor}; font-weight:600;">
            ${sign}${formatINR(pl)}<br>
            <span style="font-size:11px;">(${sign}${pct.toFixed(2)}%)</span>
          </td>
        </tr>
      `;
    }).join('');

    const netPL = totVal - totCost;
    const netPct = totCost > 0 ? (netPL / totCost) * 100 : 0;
    const sign = netPL >= 0 ? '+' : '';

    document.getElementById('totalCurrentVal').textContent = formatINR(totVal);
    document.getElementById('totalPL').innerHTML = `
      Invested: ${formatINR(totCost)} &bull; 
      <span style="color:${netPL >= 0 ? 'var(--profit)' : 'var(--loss)'}; font-weight:700;">
        ${sign}${formatINR(netPL)} (${sign}${netPct.toFixed(2)}%)
      </span>
    `;
  }

  function exportForMasterVault() {
    let totVal = 0, totCost = 0;
    portfolio.forEach(item => {
      totVal += Number(item.valuation || 0);
      totCost += Number(item.investedCost || 0);
    });

    const payload = {
      satelliteSource: "MarketAssetsSatellite_GHActions",
      projectionDate: new Date().toISOString(),
      vaultBucketSummary: {
        bucketCategory: "Market Assets",
        totalCurrentMarketValue: totVal,
        totalInvestedCost: totCost
      },
      holdings: portfolio
    };

    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `vault-projection-${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  window.addEventListener('DOMContentLoaded', loadPortfolioData);
</script>

</body>
</html>
