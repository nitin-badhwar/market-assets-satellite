<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Assets Satellite Tracker</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #2f81f7;
      --success: #238636;
      --danger: #da3633;
      --profit: #3fb950;
      --loss: #f85149;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
      line-height: 1.5;
    }

    .container { max-width: 1300px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    h1 { font-size: 20px; font-weight: 600; }
    .subtitle { font-size: 13px; color: var(--text-muted); }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .card-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
    .card-value { font-size: 22px; font-weight: 700; margin-top: 4px; font-family: var(--font-mono); }
    .card-sub { font-size: 12px; margin-top: 4px; font-family: var(--font-mono); }

    .actions-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
    }
    button, label.btn {
      background-color: #21262d;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    button:hover, label.btn:hover { background-color: #30363d; }
    button.primary { background-color: var(--accent); border-color: rgba(255,255,255,0.1); color: #fff; }
    button.primary:hover { opacity: 0.9; }
    button.export { background-color: var(--success); border-color: rgba(255,255,255,0.1); color: #fff; }

    input[type="file"] { display: none; }

    .config-box {
      background: #1c2128;
      border: 1px solid #444c56;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
    }
    .form-drawer {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
      display: none;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-top: 14px;
    }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 12px; color: var(--text-muted); font-weight: 500; }
    input, select {
      background: #0d1117;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
    }
    input:focus, select:focus { outline: 1px solid var(--accent); }

    table { width: 100%; border-collapse: collapse; margin-top: 8px; text-align: left; }
    th, td { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 13px; }
